<div class="auth-wrapper">
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="row justify-content-center w-100">
      
      <div class="col-11 col-sm-8 col-md-6 col-lg-4 col-xl-3">
        
        <div class="glass-card shadow-lg p-4 p-md-5">
          <div class="text-center mb-4">
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to your account</p>
          </div>

          <form (ngSubmit)="login()">
            <div class="mb-3">
              <label class="form-label fw-bold small text-secondary">EMAIL ADDRESS</label>
              <input type="email" class="form-control rounded-pill px-3" 
                     [(ngModel)]="loginObj.username" name="username" placeholder="Enter email">
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold small text-secondary">PASSWORD</label>
              <input type="password" class="form-control rounded-pill px-3" 
                     [(ngModel)]="loginObj.userPassword" name="userPassword" placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-bold shadow-sm">
              SIGN IN
            </button>

            <div class="text-center mt-3">
               <p class="small mb-0">Don't have an account?</p>
               <a href="#" class="text-primary fw-bold text-decoration-none">Signup</a>
            </div>
          </form>

        </div>
      </div>
      
    </div>
  </div>
</div>

<main class="mt-5 pt-3">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-12 fw-bold fs-3">
        Patients Report By Year
      </div>
    </div>

    <!-- Chart Section -->
    <div class="row">
      <div class="col-lg-12 mb-3">
        <div class="card">
          <div class="card-header bg-info fw-bold">Patients by Year</div>
          <div class="card-body">
            <canvas id="patientChart" width="400" height="150"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Table Section -->
    <div class="row">
      <div class="col-lg-12 mb-3">
        <div class="card">
          <div class="card-header bg-info fw-bold">Yearly Data</div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped table-bordered">
                <thead>
                  <tr>
                    <th>Year</th>
                    <th>Total Patients</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let data of patientData">
                    <td>{{ data.patientYear }}</td>
                    <td>{{ data.totalPatients }}</td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr>
                    <td><strong>Total</strong></td>
                    <td><strong>{{ totalPatients }}</strong></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

```html
<main class="mt-5 pt-3">
  <div class="container-fluid">

    <!-- Page Heading -->
    <div class="row">
      <div class="col-md-12 fw-bold fs-3">
        Appointments Report By Doctor
      </div>
    </div>

    <!-- Chart Section -->
    <div class="row">
      <div class="col-lg-12 mb-3">
        <div class="card">
          <div class="card-header bg-info fw-bold">
            Appointments Per Doctor
          </div>
          <div class="card-body">
            <canvas id="appointmentChart" width="400" height="150"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Table Section -->
    <div class="row">
      <div class="col-lg-12 mb-3">
        <div class="card">
          <div class="card-header bg-info fw-bold">
            Appointment Count Details
          </div>

          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped table-bordered">
                <thead>
                  <tr>
                    <th>Doctor Name</th>
                    <th>Total Appointments</th>
                  </tr>
                </thead>

                <tbody>
                  <tr *ngFor="let data of appointmentData">
                    <td>{{ data.doctorName }}</td>
                    <td>{{ data.appointmentCount }}</td>
                  </tr>
                </tbody>

                <tfoot>
                  <tr>
                    <td><strong>Total</strong></td>
                    <td><strong>{{ totalAppointments }}</strong></td>
                  </tr>
                </tfoot>

              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>
